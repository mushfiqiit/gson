plugins {
    id 'java'
    id 'net.ltgt.errorprone' version '3.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    errorprone           'com.google.errorprone:error_prone_core:2.49.0'
    annotationProcessor  'com.uber.nullaway:nullaway:0.13.7'
    compileOnly          'com.uber.nullaway:nullaway-annotations:0.13.7'
    compileOnly          'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly          'org.jspecify:jspecify:0.3.0'
    compileOnly          fileTree(dir: '/Users/mushfiqurrahmanchowdhury/gson-deps', include: '*.jar')
}

sourceSets {
    main {
        java {
            srcDirs = ['.']
            include 'com/**/*.java'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.WARN)
        option('NullAway:AnnotatedPackages', 'com.google.gson')
        option('NullAway:JSpecifyMode', 'false')
        check('RequireExplicitNullMarking', net.ltgt.gradle.errorprone.CheckSeverity.OFF)
    }
    options.compilerArgs << '-Xmaxwarns' << '10000'
}
